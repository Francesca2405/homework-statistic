<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Francesca Maggiore - Statistics & Cryptography Assignments</title>
    <style>
        body {
            font-family: "Georgia", "Palatino Linotype", "Book Antiqua", serif;
            line-height: 1.6;
            color: #3d4a3e; /* Grigio-verde scuro naturale invece che nero */
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 30px;
            background-color: #FAF6F0; /* Crema caldo */
            text-align: center;
        }
        h1 { 
            color: #4a5c4d; /* Verde salvia scuro */
            font-size: 2.8em; 
            margin-bottom: 10px;
            font-weight: normal;
            letter-spacing: -0.5px;
        }
        .subtitle { 
            color: #728c75; /* Verde salvia medio */
            font-style: italic; 
            margin-bottom: 50px; 
            font-size: 1.3em; 
        }
        
        .decoration {
            margin: -30px auto 40px;
            font-size: 24px;
            color: #a3b899; /* Dettaglio floreale/naturale salvia */
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }
        .menu-btn {
            display: block;
            width: 85%;
            max-width: 450px;
            padding: 22px;
            background-color: #FFFDF9; /* Bianco caldo */
            color: #4a5c4d;
            text-decoration: none;
            font-size: 1.25em;
            font-weight: bold;
            border: 2px solid #a3b899; /* Bordo verde salvia desaturato */
            border-radius: 16px; /* Angoli più arrotondati e morbidi */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 12px rgba(114, 140, 117, 0.05);
        }
        .menu-btn:hover {
            background-color: #728c75; /* Sfondo verde salvia */
            color: #FFFDF9;
            border-color: #728c75;
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(114, 140, 117, 0.15);
        }
        .disabled-btn {
            border-color: #e0dacf;
            color: #b0a99f;
            background-color: #faf8f5;
            cursor: not-allowed;
            box-shadow: none;
        }
        .disabled-btn:hover {
            background-color: #faf8f5;
            color: #b0a99f;
            border-color: #e0dacf;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
